name: Ascend APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      run_ui:
        description: Run optional emulator checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Use stable test signing key if configured
        env:
          TEST_KEYSTORE: ${{ secrets.ASCEND_TEST_KEYSTORE_B64 }}
        run: |
          if [ -n "$TEST_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Check sources, tests and lint; build APK
        run: |
          python tools/icerik_derle.py --check
          python tools/check_category_art.py
          python tools/check_scene_art.py
          bash gradlew :app:testDebugUnitTest :app:lintDebug :app:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Ascend-9.13.0-test-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Publish installable test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Ascend-9.13.0.apk
          if ! gh release view v9.13.0-ui >/dev/null 2>&1; then
            gh release create v9.13.0-ui Ascend-9.13.0.apk --target "$GITHUB_SHA" --prerelease --title "Ascend 9.13.0 — Safe sharing and detailed artwork" --notes "System-fitted sharing window, higher quality widget imagery, restored photographic contrast and home Pro entry."
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: unit-tests-and-lint
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 7

  ui-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2 -feature -Vulkan
          disable-animations: true
          script: bash .github/scripts/ui-tests.sh
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ui-test-results-and-screenshots
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
          retention-days: 7
      - name: Publish visual evidence
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d screenshots ]; then
            zip -r Ascend-9.13.0-visual-evidence.zip screenshots app/build/outputs/androidTest-results/ || true
            gh release upload v9.13.0-ui Ascend-9.13.0-visual-evidence.zip --clobber
          fi

  share-regression:
    if: github.event_name == 'push'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2 -feature -Vulkan
          disable-animations: true
          script: bash .github/scripts/share-regression.sh
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          adb pull /sdcard/Download/ascend-screenshots/. screenshots/ || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: focused-share-regression
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
      - name: Publish screenshots
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v9.13.0-ui screenshots/*.png --clobber
