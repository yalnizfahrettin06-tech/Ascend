name: Ascend APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Use stable test signing key if configured
        env:
          TEST_KEYSTORE: ${{ secrets.ASCEND_TEST_KEYSTORE_B64 }}
        run: |
          if [ -n "$TEST_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$TEST_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Build APK, run unit tests and lint
        run: |
          python tools/icerik_derle.py --check
          python tools/check_category_art.py
          python tools/check_scene_art.py
          bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Ascend-8.0.0-test-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: unit-tests-and-lint
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 7

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/ui-tests.sh
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: ui-test-results-and-screenshots
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
          retention-days: 7
